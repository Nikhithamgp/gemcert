# Render Blueprint — one always-on web service. Database: Neon (free) or Render Postgres.
# Images: Cloudflare R2 (S3-compatible). Fill the "sync: false" values in the Render dashboard.
services:
  - type: web
    name: gemcert
    runtime: node
    plan: free # change to "starter" (~$7/month) so the service never sleeps
    region: singapore # pick the region closest to your customers
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://verify.yourlab.com
      - key: CERTIFICATE_PREFIX
        value: SLN
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: SESSION_TTL_HOURS
        value: "12"
